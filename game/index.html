<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Court — a duel of ember and oath</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #06231d; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    color: #f5eeda;
    display: flex; align-items: center; justify-content: center;
  }
  #stage {
    width: 1280px; height: 720px; flex: none; position: relative;
    overflow: hidden; background: radial-gradient(ellipse at 50% 30%, #14584a 0%, #0b3a30 55%, #072720 100%);
    border: 4px solid #c9a227; border-radius: 6px;
    box-shadow: inset 0 0 0 2px rgba(201,162,39,.35), inset 0 0 90px rgba(0,0,0,.55);
    padding: 14px 26px;
  }
  .staged * { transition: none !important; animation: none !important; }

  /* ---------- shared ---------- */
  .gold-btn {
    font-family: Georgia, serif; font-weight: bold; font-size: 20px; letter-spacing: 1px;
    color: #241a00; background: linear-gradient(180deg, #ffe27a, #e8b90f 60%, #c9960a);
    border: 2px solid #7a5c00; border-radius: 12px; padding: 12px 26px; cursor: pointer;
    box-shadow: 0 3px 0 #7a5c00, 0 6px 14px rgba(0,0,0,.45);
  }
  .gold-btn:hover { filter: brightness(1.08); }
  .gold-btn:disabled { opacity: .45; cursor: default; }
  .gold-btn.big { font-size: 26px; padding: 16px 38px; }
  .glyph { display: block; }

  /* ---------- table ---------- */
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .brand { font-size: 24px; font-weight: bold; letter-spacing: 5px; color: #f2d06b; }
  .round-pill {
    font-size: 22px; font-weight: bold; letter-spacing: 2px; color: #fff;
    background: #8f1d12; border-radius: 20px; padding: 5px 22px;
  }
  .score-line { font-size: 20px; letter-spacing: 1px; color: #f5eeda; }
  .life-row { display: flex; align-items: center; gap: 16px; }
  .life-label { font-size: 20px; letter-spacing: 2px; width: 330px; flex: none; color: #ffe9a8; }
  .life-bar {
    flex: 1; height: 26px; background: #04150f; border: 2px solid #c9a227;
    border-radius: 13px; overflow: hidden;
  }
  .life-fill { height: 100%; transition: width .35s ease; }
  .life-num { font-size: 46px; font-weight: bold; line-height: 1; width: 110px; text-align: right; color: #fff; }
  .life-num .life-max { font-size: 22px; color: #cbbf9a; }
  .ember-row { display: flex; align-items: center; gap: 10px; font-size: 17px; color: #d8cfae; margin: 2px 0 4px 346px; }
  .dots { display: inline-flex; gap: 5px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #1d4a3c; border: 1px solid #6b5a1e; }
  .dot.on { background: #ffb62e; border-color: #ffd97a; box-shadow: 0 0 6px #ffb62e; }
  .intent-banner {
    margin: 4px auto 8px; width: fit-content; max-width: 900px;
    font-size: 22px; font-weight: bold; letter-spacing: .5px; color: #dbe9ff;
    background: #12294d; border: 2px solid #4d7dd1; border-radius: 10px; padding: 9px 24px;
  }
  .warden-hand { display: flex; justify-content: center; gap: 14px; margin-bottom: 6px; }
  .card-back {
    width: 92px; height: 128px; border-radius: 10px; flex: none;
    background: repeating-linear-gradient(45deg, #7e1a12 0 10px, #93231a 10px 20px);
    border: 3px solid #c9a227; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px;
  }
  .back-glyph { font-size: 26px; color: #f2d06b; }
  .back-word { font-size: 11px; letter-spacing: 2px; text-align: center; color: #f2d06b; }
  .status-strip { display: flex; align-items: center; gap: 18px; margin: 2px 0 6px; }
  .surge-callout {
    flex: none; font-size: 24px; font-weight: bold; letter-spacing: 1px; color: #241a00;
    background: linear-gradient(180deg, #ffe27a, #f0b90b); border: 2px solid #7a5c00;
    border-radius: 12px; padding: 8px 18px; box-shadow: 0 0 18px rgba(255,190,60,.55);
  }
  .surge-callout.empty { background: #0d3a2e; color: #9db8a4; border-color: #2c5a48; box-shadow: none; font-size: 17px; font-weight: normal; }
  .log-line { flex: 1; text-align: center; font-style: italic; font-size: 18px; color: #e8ddba; }
  .my-hand { display: flex; justify-content: center; gap: 14px; }
  .card {
    width: 150px; height: 212px; flex: none; position: relative; border-radius: 12px;
    background: linear-gradient(180deg, #fff8e2, #f3e3b8); color: #241a00;
    border: 4px solid #999; padding: 8px 6px 6px; text-align: center;
    display: flex; flex-direction: column; align-items: center;
    box-shadow: 0 6px 14px rgba(0,0,0,.5);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card.playable { cursor: pointer; }
  .card.playable:hover { transform: translateY(-10px); box-shadow: 0 14px 22px rgba(0,0,0,.6); }
  .card:not(.playable) { filter: saturate(.75) brightness(.82); }
  .cost {
    position: absolute; top: -9px; left: -9px; width: 32px; height: 32px; border-radius: 50%;
    background: #ff8c1a; border: 3px solid #7a3c00; color: #fff;
    font-size: 20px; font-weight: bold; line-height: 27px; text-align: center;
    box-shadow: 0 2px 6px rgba(0,0,0,.5);
  }
  .card .value { font-size: 66px; font-weight: bold; line-height: 1.02; color: #1d1305; }
  .card-name { font-size: 17px; font-weight: bold; margin-top: 2px; }
  .card-line { font-size: 14px; color: #5a4a22; }
  .card-effect { font-size: 13px; color: #6b5a30; margin-top: 2px; }

  /* ---------- title ---------- */
  .title-screen { text-align: center; padding-top: 26px; }
  .eyebrow { font-size: 22px; letter-spacing: 7px; color: #d8cfae; }
  .game-title {
    font-size: 108px; line-height: 1.05; letter-spacing: 6px; font-weight: bold; color: #f2c94c;
    text-shadow: 0 4px 0 #7a5c00, 0 10px 26px rgba(0,0,0,.7); margin: 4px 0 2px;
  }
  .tagline { font-size: 24px; font-style: italic; color: #efe6c4; margin-bottom: 16px; }
  .rules { list-style: none; margin: 18px auto 14px; font-size: 20px; line-height: 1.55; color: #efe6c4; }
  .rules b { color: #f2c94c; }
  .sample-hand { display: flex; justify-content: center; gap: 14px; margin-top: 6px; }
  .footline { margin-top: 14px; font-size: 17px; color: #cbbf9a; }

  /* ---------- end screens ---------- */
  .end-screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .end-screen.win { background: radial-gradient(ellipse at 50% 40%, #5a4d08 0%, #2c3d06 45%, #0a2408 100%); }
  .end-screen.loss { background: radial-gradient(ellipse at 50% 40%, #12242c 0%, #0a1a1e 55%, #04100f 100%); }
  #embers { position: absolute; inset: 0; width: 100%; height: 100%; }
  .loss-table { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: center; gap: 14px; padding-top: 70px; opacity: .28; filter: grayscale(.4); }
  .end-inner { position: relative; text-align: center; }
  .end-stars { font-size: 30px; letter-spacing: 14px; color: #ffd94d; text-shadow: 0 0 18px #ffbf2e; }
  .end-title {
    font-size: 96px; letter-spacing: 8px; font-weight: bold; line-height: 1.1;
    color: #ffd94d; text-shadow: 0 0 34px rgba(255,200,60,.75), 0 4px 0 #7a5c00;
  }
  .end-screen.loss .end-title { color: #b9c8de; text-shadow: 0 0 30px rgba(140,170,220,.6), 0 4px 0 #1c2c44; }
  .end-sub { font-size: 24px; font-style: italic; color: #efe6c4; margin: 6px 0 22px; }
  .stats {
    display: flex; gap: 0; margin: 0 auto 26px; width: fit-content;
    background: rgba(0,0,0,.45); border: 2px solid #c9a227; border-radius: 12px; overflow: hidden;
  }
  .stat { padding: 12px 26px; text-align: center; }
  .stat + .stat { border-left: 1px solid rgba(201,162,39,.5); }
  .stat-label { display: block; font-size: 15px; letter-spacing: 2px; color: #cbbf9a; }
  .stat-value { display: block; font-size: 36px; font-weight: bold; color: #fff; }
</style>
</head>
<body>
  <div id="stage"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
