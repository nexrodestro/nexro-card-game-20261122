<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ember Court — a duel of ember and oath</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #07110f; font-family: Georgia, 'Times New Roman', serif; color: #f3e9c8; }
  #stage {
    width: 1280px; height: 720px; margin: 0 auto; position: relative; overflow: hidden;
    background: radial-gradient(ellipse at 50% 30%, #14524a 0%, #0d3833 55%, #082420 100%);
    border: 6px solid #b08d3e; outline: 2px solid #5c4517; outline-offset: -10px;
  }
  .topbar { display: flex; justify-content: space-between; align-items: center;
    padding: 10px 26px; background: rgba(0,0,0,.35); border-bottom: 2px solid #b08d3e; }
  .brand { font-size: 22px; letter-spacing: 4px; color: #e8c15a; font-weight: bold; }
  .round { font-size: 20px; color: #f3e9c8; }
  .score { font-size: 20px; color: #e8c15a; }
  .side { padding: 8px 26px; }
  .side-name { font-size: 15px; letter-spacing: 3px; color: #c9b478; margin-bottom: 4px; }
  .life-row { display: flex; align-items: center; gap: 14px; }
  .life { display: flex; align-items: center; gap: 10px; }
  .life-num { font-size: 40px; font-weight: bold; color: #fff; min-width: 52px; text-align: center;
    text-shadow: 0 0 12px rgba(255,120,60,.8); }
  .life-bar { width: 300px; height: 18px; background: #2a0d0d; border: 2px solid #b08d3e; border-radius: 9px; overflow: hidden; }
  .life-bar i { display: block; height: 100%; background: linear-gradient(90deg, #ff7a3c, #ffb347); transition: width .35s; }
  .life-label { font-size: 13px; letter-spacing: 2px; color: #e8c15a; }
  .ember { font-size: 17px; color: #ffd98a; }
  .ember .pips { letter-spacing: 2px; color: #ff9a3c; }
  .block { font-size: 16px; color: #9fd6ff; }
  .warden-hand { display: flex; gap: 8px; margin-top: 6px; min-height: 96px; }
  .intent { margin-top: 6px; font-size: 19px; color: #ffb347; background: rgba(0,0,0,.4);
    display: inline-block; padding: 4px 14px; border: 1px solid #b08d3e; border-radius: 6px; }
  .middle { padding: 4px 26px; min-height: 74px; }
  .surge-callout { font-size: 26px; font-weight: bold; color: #ffd94a; text-align: center;
    text-shadow: 0 0 14px rgba(255,180,40,.9); padding: 4px 0; }
  .surge-callout.empty { font-size: 16px; color: #9db8a8; text-shadow: none; font-weight: normal; }
  .log { font-size: 15px; color: #cfe3d4; text-align: center; font-style: italic; }
  .my-hand { display: flex; gap: 10px; justify-content: center; margin-top: 4px; min-height: 168px; }
  .actions { display: flex; align-items: center; gap: 18px; justify-content: center; margin-top: 6px; }
  .actions button, #play-btn, #again-btn {
    font-family: inherit; font-size: 20px; font-weight: bold; color: #241a05;
    background: linear-gradient(180deg, #ffd94a, #d9a521); border: 2px solid #8a6a1c;
    border-radius: 8px; padding: 10px 26px; cursor: pointer; }
  .actions button:hover, #play-btn:hover, #again-btn:hover { filter: brightness(1.12); }
  .hint { font-size: 14px; color: #9db8a8; }
  .card {
    width: 118px; height: 158px; border-radius: 10px; position: relative; flex: none;
    background: linear-gradient(180deg, #fdf6e3 0%, #f3e2b8 100%);
    border: 3px solid var(--suit, #888); color: #241a05; text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,.5); transition: transform .18s, box-shadow .18s;
  }
  .card.playable { cursor: pointer; transform: translateY(-8px); box-shadow: 0 10px 18px rgba(0,0,0,.6), 0 0 0 3px #ffd94a; }
  .card.playable:hover { transform: translateY(-14px) rotate(-1deg); }
  .card:not(.playable) { filter: brightness(.72); }
  .card-cost { position: absolute; top: 6px; left: 8px; font-size: 16px; font-weight: bold; color: #7a4a00; }
  .card-glyph { margin-top: 18px; line-height: 0; }
  .card-value { font-size: 40px; font-weight: bold; line-height: 1; color: var(--suit-dark, #333); }
  .card-type { font-size: 15px; font-weight: bold; letter-spacing: 1px; margin-top: 2px; }
  .card-name { font-size: 13px; font-style: italic; margin-top: 2px; padding: 0 6px; line-height: 1.1; white-space: nowrap; overflow: hidden; }
  .card-suit { position: absolute; bottom: 6px; left: 0; right: 0; font-size: 12px; letter-spacing: 2px; color: var(--suit, #888); font-weight: bold; }
  /* A big hand shrinks its cards so the row never spills past the table. */
  .my-hand.many { gap: 6px; }
  .my-hand.many .card { width: 92px; height: 126px; }
  .my-hand.many .card-glyph { margin-top: 12px; }
  .my-hand.many .card-glyph svg { width: 26px; height: 26px; }
  .my-hand.many .card-value { font-size: 32px; }
  .my-hand.many .card-type { font-size: 12px; }
  .my-hand.many .card-name { font-size: 11px; }
  .my-hand.many .card-suit { font-size: 10px; bottom: 4px; }
  .my-hand.many .card-cost { font-size: 13px; }
  .card.back { background: linear-gradient(160deg, #3a2a12, #1d150a); border-color: #b08d3e;
    width: 84px; height: 112px; transform: rotate(var(--rot, 0deg)); }
  .card.back .back-glyph { margin-top: 26px; opacity: .85; }
  .card.back .back-mark { font-size: 30px; color: #e8c15a; font-weight: bold; }
  .title-screen { text-align: center; padding-top: 66px; }
  .title-screen h1 { font-size: 88px; letter-spacing: 10px; color: #e8c15a;
    text-shadow: 0 0 30px rgba(255,170,40,.55), 0 4px 0 #5c4517; }
  .subtitle { font-size: 26px; font-style: italic; color: #f3e9c8; margin: 8px 0 22px; }
  .rules { font-size: 18px; line-height: 1.7; color: #d8e6da; margin-bottom: 26px; }
  #play-btn { font-size: 26px; padding: 14px 44px; }
  .sample-hand { display: flex; gap: 10px; justify-content: center; margin-top: 34px; }
  .sample-hand .card { transform: rotate(var(--rot, 0deg)); filter: none; }
  .surge-note { margin-top: 26px; font-size: 15px; color: #9db8a8; font-style: italic; }
  .end-screen { position: absolute; inset: 0; background: rgba(4, 16, 13, .88);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .end-screen.win { background: radial-gradient(ellipse at 50% 40%, rgba(255,190,60,.28), rgba(4,16,13,.92) 70%); }
  .end-title { font-size: 52px; letter-spacing: 3px; font-weight: bold; color: #ffd94a;
    text-shadow: 0 0 26px rgba(255,180,40,.8); max-width: 1100px; }
  .end-screen.loss .end-title { color: #9db8d6; text-shadow: 0 0 26px rgba(90,140,200,.7); }
  .end-line { font-size: 22px; font-style: italic; margin: 16px 0; }
  .end-stats { font-size: 22px; color: #f3e9c8; margin-bottom: 30px; }
  body.staging * { transition: none !important; animation: none !important; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
